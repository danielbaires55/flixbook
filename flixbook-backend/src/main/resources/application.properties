# Dice al driver del database di usare l'orario italiano
# Rende la configurazione portabile via variabili d'ambiente con default sensati per sviluppo
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flixbookdb}?useLegacyDatetimeCode=false&serverTimezone=${DB_TZ:Europe/Rome}

spring.jackson.time-zone=Europe/Rome
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Usa solo la baseline per evitare conflitti di versioni duplicate (ci sono più V1 in db/migration)
spring.flyway.locations=classpath:db/baseline

# Make repo portable: when app.seed=true, DataInitializer will execute classpath:actdump.sql to prefill data
app.seed=false

spring.flyway.ignore-migration-patterns=*:missing

jwt.

jwt.expiration=86400000

spring.jackson.serialization.fail-on-empty-beans=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

twilio.enabled=${TWILIO_ENABLED:true}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
# Default region/country to normalize patient numbers like 3331234567 -> +393331234567
twilio.default.country=IT
twilio.default.countryCode=+39

# Optional: raise logging for SmsService diagnostics
# logging.level.com.flixbook.flixbook_backend.service.SmsService=DEBUG

# Filesystem uploads base directory (where profile images are saved)
# You can set an absolute path; default is relative to the working dir
app.uploads.dir=uploads

# Calendar integration toggles
calendar.ics.enabled=true
calendar.google.link.enabled=true
